on:
  release:
    types:
      - created

name: prd

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # @v4.3.0
      - name: Use Node.js 16.x
        uses: actions/setup-node@v1
        with:
          node-version: 24
      - name: Install
        run: npm ci
      - name: Prd
        run: npm run build
        env:
          BUILDER_SERVER_URL: https://builder-api.decentraland.org
          AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY_PRD }}
          AWS_ACCESS_SECRET: ${{ secrets.AWS_ACCESS_SECRET_PRD }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME_PRD }}
          S3_REGION: us-east-1
          S3_UPLOAD_CONCURRENCY: 20
      - name: upgrade npm for Trusted Publishing
        run: corepack install -g npm@11 && npm --version
      - name: Publish
        uses: decentraland/oddish-action@0074f2d535c43b5c83f136525304a6277166d77f # @master
        with:
          access: public
        env:
